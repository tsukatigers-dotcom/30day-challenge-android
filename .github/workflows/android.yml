name: Android APK Build v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'challenge-v2-1.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q challenge-v2-1.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/assets/app.js
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build both APK variants
        working-directory: project
        run: gradle :app:assembleOriginalDebug :app:assembleSafeDebug
      - name: Upload safe side-by-side APK
        uses: actions/upload-artifact@v4
        with:
          name: challenge-safe-apk
          path: project/app/build/outputs/apk/safe/debug/app-safe-debug.apk
          if-no-files-found: error
      - name: Upload original-package APK
        uses: actions/upload-artifact@v4
        with:
          name: challenge-original-apk
          path: project/app/build/outputs/apk/original/debug/app-original-debug.apk
          if-no-files-found: error
